<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Thomasukutty Reji — Full Stack MERN Developer crafting exceptional digital experiences with React, Node.js, Three.js and modern web technologies." />
    <meta name="keywords" content="MERN Stack Developer, React Developer, Full Stack Developer, Portfolio, Thomasukutty Reji, WebGL, Three.js" />

    <meta property="og:title" content="Thomasukutty Reji | Full Stack Developer" />
    <meta property="og:description" content="Full Stack Developer crafting beautiful, high-performance web applications." />
    <meta property="og:type" content="website" />
    <title>Thomasukutty Reji — Full Stack Developer</title>

    <!-- Preconnect -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />

    <!--
      display=swap prevents render-blocking — text shows in fallback font
      immediately, then swaps when the webfont downloads.
    -->
    <link
      href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@300;400;500;600;700&family=Space+Mono:wght@400;700&family=Bebas+Neue&display=swap"
      rel="stylesheet"
      media="print"
      onload="this.media='all'"
    />
    <!-- Noscript fallback -->
    <noscript>
      <link
        href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@300;400;500;600;700&family=Space+Mono:wght@400;700&family=Bebas+Neue&display=swap"
        rel="stylesheet"
      />
    </noscript>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
